[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoqing-voice-assistant"
version = "0.1.0"
description = "小清 · Qt 桌面语音助手（唤醒 + 本地识别 + 大模型 + 工具调用 + TTS）"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF012", "PIE810", "SIM102"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tools/*.py" = ["E402"]
